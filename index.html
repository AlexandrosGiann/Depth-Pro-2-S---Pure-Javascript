<!doctype html>
<html lang="el">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depth Pro 2 S</title>
<style>
  :root { color-scheme: dark; font: 100%/1.5 system-ui, sans-serif; background: #0f1821; color: #e8eef3; }
  body { margin: 0; }
  main { max-width: 65rem; margin: 0 auto; padding: clamp(1.1rem, 5vw, 4rem); }
  header { margin-bottom: 2rem; }
  h1 { font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.1; margin: 0 0 .75rem; }
  p { margin-block: .5rem; }
  #model-status { color: #9ce3d0; }
  .panel { background: #192734; border: 1px solid #344756; padding: clamp(1rem, 3vw, 1.75rem); border-radius: 1rem; }
  .controls { display: flex; flex-wrap: wrap; align-items: end; gap: 1rem; }
  label { display: grid; gap: .45rem; font-weight: 600; min-width: 0; }
  input { max-width: 100%; }
  button, input::file-selector-button { font: inherit; border: 0; border-radius: .5rem; padding: .65rem .9rem; cursor: pointer; }
  button { background: #9ce3d0; color: #102421; font-weight: 700; }
  button:disabled { opacity: .5; cursor: default; }
  input::file-selector-button { background: #354957; color: #f5fafc; margin-right: .55rem; }
  #status { color: #d0dae2; }
  .progress-info { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
  .progress-info span { font-variant-numeric: tabular-nums; color: #d0dae2; }
  progress { display: block; width: 100%; height: .85rem; accent-color: #9ce3d0; }
  .previews { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 1rem; margin-top: 1rem; }
  figure { margin: 0; min-width: 0; }
  figcaption { font-weight: 600; margin-bottom: .45rem; }
  .image { aspect-ratio: 4 / 3; display: grid; place-items: center; overflow: hidden; border: 1px dashed #536675; border-radius: .6rem; background: #111c25; }
  canvas:not([hidden]) { width: 100%; height: 100%; object-fit: contain; min-height: 0; }
</style>
<main>
  <header>
    <h1>Depth Pro 2 S</h1>
    <p>Χάρτης βάθους από μια φωτογραφία. Η επεξεργασία γίνεται στον browser.</p>
    <div class="progress-info">
      <label for="model-progress">Λήψη μοντέλου</label>
      <span id="model-percent" aria-hidden="true">0%</span>
    </div>
    <progress id="model-progress" max="100" value="0"></progress>
    <p id="model-status" role="status">Φόρτωση μοντέλου από το τοπικό δίκτυο (97,3 MB)…</p>
  </header>
  <section class="panel" aria-label="Εργαλείο εκτίμησης βάθους">
    <div class="controls">
      <label>Φωτογραφία <input id="photo-file" type="file" accept="image/*"></label>
      <button id="predict" type="button" disabled>Υπολόγισε βάθος</button>
    </div>
    <div class="progress-info">
      <label for="depth-progress">Υπολογισμός βάθους</label>
      <span id="depth-percent" aria-hidden="true">0%</span>
    </div>
    <progress id="depth-progress" max="100" value="0"></progress>
    <p id="status" role="status"></p>
    <div class="previews">
      <figure>
        <figcaption>Φωτογραφία</figcaption>
        <div class="image"><canvas id="source" aria-label="Προεπισκόπηση φωτογραφίας" hidden></canvas></div>
      </figure>
      <figure>
        <figcaption>Χάρτης βάθους</figcaption>
        <div class="image"><canvas id="result" aria-label="Χάρτης αντίστροφου βάθους" hidden></canvas></div>
      </figure>
    </div>
  </section>
</main>
<script type="module" src="./app.mjs"></script>
</html>
